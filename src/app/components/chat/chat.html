<div
  class="flex flex-col w-full bg-[#09090B] text-[#E5E2E1]"
  [ngClass]="{ 'justify-center': !hasMessages }"
>
  @if (hasMessages) {
    <header class="flex justify-center py-6">
      <span class="px-4 py-1 rounded-full bg-[#FFFFFF08] text-xs text-[#CFC2D6]">
        Hoje, 14:32
      </span>
    </header>
  }

  @if (hasMessages) {
    <section class="flex-1 overflow-y-auto px-6">
      <div class="max-w-5xl mx-auto flex flex-col gap-y-8">
        @for (message of messages; track message.content + message.kind + $index) {
          @if (message.role === 'user') {
            <app-user-request [content]="message.content" [kind]="message.kind"></app-user-request>
          } @else {
            <app-assistant-response
              [content]="message.content"
              [isPending]="message.status === 'pending'"
            ></app-assistant-response>
          }
        }
      </div>
    </section>
  }

  <app-input-chat
    [hasMessages]="hasMessages"
    (messageSent)="messageSent.emit($event)"
  ></app-input-chat>
</div>
