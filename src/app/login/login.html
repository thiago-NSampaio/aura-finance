<div class="flex w-full justify-center h-screen">
  <div class="flex flex-col max-w-125 max-h-screen px-5 justify-evenly">
    <div class="flex gap-y-2 flex-col justify-center items-center">
      <div class="w-fit brand-logo mt-18 mb-6">
        <div class="rounded-full p-12 flex items-center justify-center logo-container">
          <div class="inner-circle p-4 rounded-full flex items-center justify-center">
            <img class="inline-block" src="icons/logo-bars.svg" alt="Logo" />
          </div>
        </div>
      </div>

      <span
        class="bg-linear-to-r from-[#DDB7FF] to-[#ADC6FF] text-center bg-clip-text text-transparent text-xl font-semibold"
        >Aura Finance</span
      >
    </div>

    <div class="flex flex-col grow align-middle justify-evenly items-center gap-y-10">
      <div class="flex flex-col mt-6 px-10 text-center gap-1.5">
        <h1 class="font-semibold text-[#E5E2E1] text-2xl">
          O futuro do controle financeiro é a sua voz
        </h1>

        <p class="text-base text-[#CFC2D6]">
          Sua inteligência artificial premium para uma gestão invisível e precisa.
        </p>
      </div>

      <!-- <svg-icon src="icons/sound-bars.svg" [svgStyle]="{ 'width.px': 52, 'height.px': 60 }"></svg-icon> -->

      <div class="w-full flex gap-4 mb-4">
        <div class="w-full rounded-2xl bg-[#1A1A1A] px-4 py-6 border border-[#ffffff10]">
          <div class="flex gap-1.5">
            <svg-icon
              src="icons/profits.svg"
              [svgStyle]="{ 'width.px': 14.5, 'height.px': 14.5 }"
            ></svg-icon>

            <span class="text-[#CFC2D6] text-xs">INSIGHTS</span>
          </div>
          <p class="text-[#E5E2E1] text-sm">Previsão de gastos via IA</p>
        </div>

        <div class="w-full rounded-2xl bg-[#1A1A1A] px-4 py-6 border border-[#ffffff10]">
          <div class="flex gap-1.5">
            <svg-icon
              src="icons/shield.svg"
              [svgStyle]="{ 'width.px': 14.5, 'height.px': 14.5 }"
            ></svg-icon>

            <span class="text-[#CFC2D6] text-xs">PRIVADO</span>
          </div>
          <p class="text-[#E5E2E1] text-sm">Criptografia de nível bancário</p>
        </div>
      </div>
    </div>

    <div class="flex flex-col w-full mt-auto mb-12">
      <button
        class="w-full py-4 mb-4 text-center bg-linear-to-r from-[#B76DFF] to-[#0566D9] rounded-3xl"
      >
        Começar minha jornada
      </button>

      <div class="flex gap-2 justify-center">
        <p class="text-[#CFC2D6]">Já possui uma conta?</p>
        <a class="text-[#DDB7FF] cursor-pointer">Entrar</a>
      </div>
    </div>
  </div>
</div>
